{% extends "base.html" %}

{% block title %}分组抽签 · KPL 年总模式{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/career.css') }}">
{% endblock %}

{% block content %}
<div class="career-page" id="drawApp" data-page="career-draw">

  <div class="c-topbar">
    <a class="c-back" href="/career" title="返回生涯首页" aria-label="返回生涯首页">‹</a>
    <h1>年总模式</h1>
    <span class="c-topbar-r" aria-hidden="true"></span>
  </div>

  <!-- 抽签中 -->
  <div id="drawStage">
    <h2 class="c-draw-title" id="drawTitle">分组抽签</h2>
    <section class="c-card">
      <div class="c-draw-stage">
        <div class="c-draw-count" id="drawCount">第 1 / 1 签</div>
        <div class="c-draw-hero" id="drawHero">
          <div class="c-dh-name" style="color:#C4B9A9;">等待开始</div>
        </div>
        <div class="c-draw-arrow" aria-hidden="true">↓</div>
        <div class="c-draw-group" id="drawGroup">—</div>
      </div>
    </section>

    <div id="groupWrap">
      <div class="c-group-grid" id="groupGrid"></div>
    </div>

    <button type="button" class="c-draw-skip" id="btnSkipDraw">跳过抽签</button>
  </div>

  <!-- 抽签结束 -->
  <div id="drawDone" hidden>
    <h2 class="c-draw-title">抽签结束</h2>
    <p class="c-draw-sub" id="drawDoneSub">—</p>
    <div id="doneWrap">
      <div class="c-group-grid" id="doneGrid"></div>
    </div>
    <button type="button" class="c-btn c-btn-primary c-btn-block c-btn-lg" id="btnEnterSeason">
      进入赛季
    </button>
  </div>

  <!-- 出错 -->
  <div id="drawError" class="c-card" hidden>
    <div class="c-empty" id="drawErrorText">—</div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/career_draw.js') }}"></script>
{% endblock %}
