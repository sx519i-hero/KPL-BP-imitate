{% extends "base.html" %}
{% block title %}KPL 模拟 BP 教练{% endblock %}

{% block content %}
  <!-- Banner -->
  <header class="banner" id="banner">
    <div class="banner-title">KPL 模拟 BP 教练</div>
    <p class="banner-sub" id="banner-sub">像职业教练一样排兵布阵，用真实 KPL 数据打完一场完整 BP</p>
  </header>

  <!-- 赛季选择 + 概览 -->
  <section class="card" id="league-card">
    <div class="card-title">赛季选择<span class="sub" id="league-status"></span></div>
    <div class="field">
      <select class="select" id="league-select" aria-label="选择赛季">
        <option value="">加载中…</option>
      </select>
    </div>
    <div class="meta-strip" id="league-meta" style="margin-top:10px"></div>
  </section>

  <!-- 模式选择 -->
  <section class="card">
    <div class="card-title">选择模式<span class="sub">对局入口统一收敛到下面三个模式</span></div>
    <div class="mode-grid" id="mode-grid">
      <button class="mode-card" type="button" data-mode="career" id="mode-career">
        <div class="mode-head">
          <span class="mode-icon" aria-hidden="true">🏆</span>
          <div class="grow">
            <div class="mode-name">KPL 年总模式</div>
            <div class="mode-desc">年度赛程包 · 春 → 挑杯 → 夏 → 年总，逐站累加年度积分</div>
          </div>
          <span class="chip badge-new mode-tag">进入</span>
        </div>
      </button>

      <button class="mode-card" type="button" data-mode="friend" id="mode-friend">
        <div class="mode-head">
          <span class="mode-icon" aria-hidden="true">🌐</span>
          <div class="grow">
            <div class="mode-name">好友 PK</div>
            <div class="mode-desc">联机 · 房主建房间，朋友填地址加入；空缺队伍自动由内置 AI 补齐</div>
          </div>
          <span class="chip badge-new mode-tag">联机</span>
        </div>
      </button>

      <button class="mode-card" type="button" data-mode="llm" id="mode-llm">
        <div class="mode-head">
          <span class="mode-icon" aria-hidden="true">🧠</span>
          <div class="grow">
            <div class="mode-name">大模型对战</div>
            <div class="mode-desc">单局 PK 或整季联赛 · 由外部大模型执教</div>
          </div>
          <span class="chip badge-new mode-tag">进入</span>
        </div>
      </button>
    </div>

    <!-- 次级入口（不承担「开启对局」职责：自由 BP 同屏、大模型、设置）
         按钮样式与「好友 PK」面板完全一致（.v4-row-btns + .btn .btn-ghost .btn-sm） -->
    <div class="v4-row-btns entry-more" id="mode-more">
      <button class="btn btn-ghost btn-sm" type="button" data-mode="free">同屏自由 BP</button>
      <button class="btn btn-ghost btn-sm" type="button" data-mode="settings">设置</button>
    </div>
  </section>

  <!-- 对阵设置 -->
  <section class="card" id="setup-card">
    <div class="card-title">对阵设置</div>

    <div class="stack" style="gap:10px">
      <div class="field">
        <label class="field-label" for="blue-select">蓝方战队</label>
        <select class="select" id="blue-select" aria-label="蓝方战队">
          <option value="">加载中…</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="red-select">红方战队</label>
        <select class="select" id="red-select" aria-label="红方战队">
          <option value="">加载中…</option>
        </select>
      </div>

      <div class="field">
        <span class="field-label">赛制</span>
        <div class="seg" id="bo-seg" role="group" aria-label="赛制">
          <button class="chip" type="button" data-bo="1">BO1</button>
          <button class="chip" type="button" data-bo="3">BO3</button>
          <button class="chip" type="button" data-bo="5">BO5</button>
          <button class="chip active" type="button" data-bo="7">BO7</button>
          <button class="chip" type="button" data-bo="9">BO9</button>
        </div>
        <!-- v2 契约 §3.1：单局模式关闭败方选边，多局由上一局败方选边 -->
        <div class="field-hint" id="bo-hint" style="margin-top:6px"></div>
      </div>

      <div class="field">
        <span class="field-label" id="side-field-label">执边</span>
        <div class="seg" id="side-seg" role="group" aria-label="执边">
          <button class="chip active" type="button" data-side="blue">蓝方</button>
          <button class="chip" type="button" data-side="red">红方</button>
        </div>
      </div>

      <div class="field" id="difficulty-field">
        <span class="field-label">AI 难度</span>
        <div class="seg" id="difficulty-seg" role="group" aria-label="AI 难度">
          <button class="chip" type="button" data-difficulty="rookie">入门</button>
          <button class="chip active" type="button" data-difficulty="pro">职业</button>
          <button class="chip" type="button" data-difficulty="boss">魔王</button>
        </div>
      </div>
    </div>

    <div id="setup-hint" class="field-hint" style="margin-top:10px"></div>

    <!-- v47：「对战（AI）」从底部导航挪到这里：选好双方战队/赛制/执边/难度后直接开打 -->
    <div class="v4-row-btns" style="margin-top:12px">
      <button class="btn btn-primary btn-sm" type="button" id="btnStartAi">开始 AI 对战</button>
    </div>
    <!-- v7：独立的「开始对战」按钮已移除，对局入口统一在上方三大模式卡片内 -->
  </section>
{% endblock %}

{% block scripts %}
  <script src="/static/js/index.js"></script>
{% endblock %}
